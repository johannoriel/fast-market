[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-agent"
version = "0.1.0"
description = "YouTube CLI tool for search, comments, and replies"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "auto-click-auto>=0.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "feedparser>=6.0",
    "requests>=2.0",
    "yt-dlp>=2024",
]

[project.optional-dependencies]
ytdlp = ["yt-dlp"]

[project.scripts]
youtube = "youtube_entry:main"

[project.entry-points."fast_market.webux_plugins"]
publish = "webux.publish.register:register"

[tool.setuptools]
packages = [
    "cli",
    "core",
    "commands",
    "commands.common",
    "commands.get_channel_id",
    "commands.get_video",
    "commands.hot",
    "commands.search",
    "commands.comments",
    "commands.reply",
    "commands.remove_silence",
    "commands.extract_transcript",
    "commands.burn_subtitles",
    "commands.upload",
    "youtube_entry",
    "webux",
    "webux.publish",
]

[tool.setuptools.package-data]
common = ["py.typed"]
