<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Publish</title>
  <style>
    :root {
      --bg:#1a1a2e; --bg2:#16213e; --text:#eee; --dim:#888;
      --accent:#0f3460; --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --border:#333;
      --link:#7dd3fc;
    }
    body { margin:0; padding:16px; background:var(--bg); color:var(--text);
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    .wrap { max-width:860px; margin:0 auto; }
    h2 { margin:0 0 12px; font-size:18px; }
    label { display:block; font-size:12px; color:var(--dim); margin-bottom:3px; }
    input[type=text], select, textarea {
      width:100%; padding:7px 10px; border:1px solid var(--border);
      background:var(--bg2); color:var(--text); border-radius:6px;
      box-sizing:border-box; font-size:13px;
    }
    textarea { resize:vertical; }
    .row { margin-bottom:10px; }
    .cols2 { display:flex; gap:12px; }
    .cols2 .row { flex:1; }
    .checkrow { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; }
    button { padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
    .btn-go     { background:var(--ok); color:#000; }
    .btn-go:hover { opacity:.88; }
    .btn-go:disabled { opacity:.4; cursor:default; }
    .btn-resume { background:var(--warn); color:#000; }
    .btn-resume:hover { opacity:.88; }
    .btn-resume:disabled { opacity:.4; cursor:default; }
    .btn-sec    { background:var(--accent); color:var(--text); }
    .btn-sec:hover { opacity:.88; }
    /* two-column main layout */
    .main-layout { display:flex; gap:16px; align-items:flex-start; }
    .main-left { flex:1; min-width:0; }
    .main-right { flex:0 0 260px; }
    /* pool */
    .pool { border:1px solid var(--border); border-radius:8px; padding:10px; margin:12px 0; background:var(--bg2); }
    .pool h3 { margin:0 0 8px; font-size:14px; }
    .pool-row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px; border-bottom:1px solid var(--border); }
    .pool-row:last-child { border-bottom:none; }
    .pool-actions button { padding:2px 6px; font-size:11px; }
    .video-wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden;
                  background:#000; display:none; }
    .video-wrap video { width:100%; height:220px; object-fit:contain; display:block; }
    .video-name { font-size:11px; color:var(--dim); padding:4px 8px;
                  background:var(--bg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* pipeline */
    .steps { margin:14px 0 10px; }
    .step { display:flex; align-items:flex-start; gap:10px; padding:6px 0;
            border-bottom:1px solid var(--border); font-size:13px; }
    .step:last-child { border-bottom:none; }
    .step-icon { width:20px; flex-shrink:0; font-size:14px; margin-top:1px; }
    .step-name { flex:1; }
    .step-progress { width:120px; height:6px; margin-left:8px; vertical-align:middle; }
    .step-out { font-size:11px; color:var(--dim); margin-top:2px; word-break:break-all; }
    .step-out.collapsed { display:none; }
    .step-toggle { cursor:pointer; font-size:10px; color:var(--dim); margin-left:6px;
                   user-select:none; opacity:.7; }
    .step-toggle:hover { opacity:1; }
    .step-time { font-size:10px; color:var(--dim); margin-left:8px;
                 font-variant-numeric:tabular-nums; }
    .log-box { background:#0f172a; border:1px solid var(--border); border-radius:8px;
               padding:10px; font-size:12px; font-family:monospace; white-space:pre-wrap;
               max-height:160px; overflow-y:auto; margin-top:10px; display:none; }
    .result { margin-top:12px; padding:12px; border-radius:8px;
              background:var(--bg2); border:1px solid var(--ok); display:none; }
    .result-title { font-size:15px; font-weight:700; margin-bottom:6px; }
    .result-desc { font-size:12px; color:var(--dim); white-space:pre-wrap; max-height:110px;
                   overflow-y:auto; border:1px solid var(--border); border-radius:4px;
                   padding:8px; background:#0f172a; margin-bottom:8px; }
    .result-links { display:flex; flex-direction:column; gap:5px; }
    .result-links a { color:var(--link); font-size:13px; word-break:break-all; }
    .hint { font-size:11px; color:var(--dim); margin-left:8px; }
    hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
    /* config */
    .config-toggle { cursor:pointer; color:var(--dim); font-size:12px; margin-bottom:8px; user-select:none; }
    .config-panel { display:none; padding:10px; border:1px solid var(--border);
                    border-radius:6px; background:var(--bg2); margin-bottom:12px; }
    .file-row { display:flex; gap:8px; align-items:flex-end; }
    .file-row input { flex:1; }
    .step-dl { font-size:11px; margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
    .step-dl a { color:var(--link); text-decoration:none; padding:1px 7px;
                 border:1px solid var(--link); border-radius:4px; opacity:.85; }
    .step-dl a:hover { opacity:1; background:rgba(125,211,252,0.1); }
    /* resume area */
    .resume-area { display:none; margin-top:8px; padding:8px 10px;
                   background:var(--bg2); border:1px solid var(--border); border-radius:6px; }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      background: var(--bg2);
      color: var(--dim);
      transition: border-color .2s, background .2s;
    }
    .drop-zone.dragover {
      border-color: var(--link);
      background: #0f3460;
    }
    .resume-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
    .resume-row select { flex:1; max-width:220px; }
  </style>
</head>
<body>
<div class="wrap">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
    <h2 style="margin:0;">Publish to YouTube</h2>
    <span id="statusDot" style="width:10px;height:10px;border-radius:50%;background:#666;display:inline-block;"></span>
  </div>

  <div class="config-toggle" onclick="toggleConfig()" style="margin-bottom:8px;">⚙ Config ▾</div>
  <div id="configPanel" class="config-panel">
    <div class="row">
      <label>Video source folder</label>
      <input type="text" id="cfgPath">
    </div>
    <div class="row">
      <label>Extensions (comma-separated)</label>
      <input type="text" id="cfgExts">
    </div>
    <div class="row">
      <label>Default title prompt</label>
      <input type="text" id="cfgTitlePrompt">
    </div>
    <div class="row">
      <label>Default description prompt</label>
      <input type="text" id="cfgDescPrompt">
    </div>
    <div class="row">
      <label>Signature (appended to descriptions)</label>
      <textarea id="cfgSignature" rows="4" style="width:100%; min-height:80px; font-family:inherit; font-size:13px;"></textarea>
    </div>
    <div class="row">
      <label>Post-publish script (absolute path)</label>
      <input type="text" id="cfgPostScript">
    </div>
    <div class="row">
      <label>Modal usage URL</label>
      <input type="text" id="cfgModalUsageUrl">
    </div>
    <button class="btn-sec" onclick="saveConfig()">Save config</button>
  </div>

  <div class="pool">
    <h3>📋 Publish Pool <span id="poolStatus" style="font-size:11px;color:var(--dim);"></span></h3>
    <div style="margin-bottom:8px;">
      <button id="poolStart" class="btn-go">▶ Start</button>
      <button id="poolStop" class="btn-sec">⏹ Stop</button>
      <button id="poolSkip" class="btn-sec">⏭ Skip</button>
      <button id="poolRedo" class="btn-sec">🔄 Redo</button>
      <button id="poolClear" class="btn-sec" style="margin-left:8px;">🧹 Clear finished</button>
    </div>
    <div style="margin-bottom:8px;">
      <button id="browserHide" class="btn-sec" onclick="browserHide()">🙈 Hide browser</button>
      <button id="browserShow" class="btn-sec" onclick="browserShow()">👁️ Show browser</button>
      <button id="browserStartSilent" class="btn-sec" onclick="browserStartSilent()">🚀 Start silent</button>
    </div>
    <div id="poolList"></div>
  </div>

  <div class="main-layout">
    <div class="main-left">
      <div class="row">
        <label>Source video</label>
        <div id="dropZone" class="drop-zone">
          <div>Drag & drop video here or</div>
          <button type="button" class="btn-sec" onclick="uploadNew()" style="margin-top:6px;">Browse files</button>
           <div style="display:flex; gap:6px; align-items:center; margin-top:8px;">
             <select id="fileSelect" style="flex:1;">
               <option value="">— or select from list —</option>
             </select>
             <button type="button" class="btn-sec" onclick="loadVideos()" style="padding:4px 8px; flex-shrink:0;">🔄</button>
             <button type="button" class="btn-sec" onclick="previewSource()" style="padding:4px 8px; flex-shrink:0;">👁</button>
           </div>
        </div>
      </div>

      <div class="cols2">
        <div class="row">
          <label>Title prompt</label>
          <select id="promptTitle"></select>
        </div>
        <div class="row">
          <label>Description prompt</label>
          <select id="promptSummary"></select>
        </div>
      </div>

      <div class="checkrow">
        <input type="checkbox" id="removeSilence" checked>
        <label for="removeSilence" style="display:inline; margin:0;">Remove silence</label>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="burnSubtitles" checked>
        <label for="burnSubtitles" style="display:inline; margin:0;">Burn subtitles</label>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="simpleTranscript" checked>
        <label for="simpleTranscript" style="display:inline; margin:0;">Simple transcript (faster)</label>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="skipUpload">
        <label for="skipUpload" style="display:inline; margin:0;">Skip YouTube upload (test)</label>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="useModal" checked>
        <label for="useModal" style="display:inline; margin:0;">Use Modal (remote processing)</label>
        <a id="modalUsageLink" href="https://modal.com/settings/usage" target="_blank" style="font-size:11px; color:var(--link); margin-left:6px; opacity:.8;">usage ↗</a>
      </div>

      <div class="cols2">
        <div class="row">
          <label>Language</label>
          <select id="language">
            <option value="fr">French</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="row">
          <label>Whisper model</label>
          <select id="model">
            <option value="tiny">tiny</option>
            <option value="base">base</option>
            <option value="small">small</option>
            <option value="medium" selected>medium</option>
            <option value="large">large</option>
          </select>
        </div>
      </div>

      <div class="cols2">
        <div class="row">
          <label>Privacy</label>
          <select id="privacy">
            <option value="unlisted" selected>unlisted</option>
            <option value="private">private</option>
            <option value="public">public</option>
          </select>
        </div>
        <div class="row">
          <label>Description prefix (optional)</label>
          <textarea id="descPrefix" rows="3" style="width:100%; min-height:60px;" placeholder="e.g. Full video: https://..."></textarea>
        </div>
      </div>

      <div class="row">
        <label>Source URLs (one per line, optional)</label>
        <textarea id="sourceUrls" rows="2" placeholder="https://..."></textarea>
      </div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn-go" onclick="startJob()" id="goBtn">Publish (immediate)</button>
        <button class="btn-sec" onclick="addToPool()" id="addPoolBtn">Add to pool</button>
        <button class="btn-resume" onclick="resumeJob()" id="resumeBtn" style="display:none;">Resume from step…</button>
        <button class="btn-sec" onclick="showConfig()">Config</button>
        <button class="btn-sec" onclick="clearConsole()">Clear console</button>
      </div>

      <div id="resumeArea" class="resume-area">
        <div class="resume-row">
          <label style="margin:0 6px 0 0; font-size:12px;">Resume from</label>
          <select id="resumeStep"></select>
          <button class="btn-resume" onclick="doResume()" style="padding:4px 10px;">Resume</button>
        </div>
        <div id="resumeFiles" class="step-dl" style="margin-top:6px;"></div>
      </div>
    </div>

    <div class="main-right">
      <div id="videoWrap" class="video-wrap">
        <video id="videoPreview" controls></video>
        <div class="video-name" id="videoName"></div>
      </div>
    </div>
  </div>

  <div class="steps" id="steps"></div>

  <div id="result" class="result">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-links" id="resultLinks"></div>
  </div>

  <div id="globalConsole" style="margin-top:16px;height:140px;max-width:860px;background:#0f172a;border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:11px;overflow-y:auto;white-space:pre-wrap;color:#aaa;display:none;">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;align-items:center;">
      <span style="color:var(--dim);">📜 Live Console (all subcommands)</span>
      <button onclick="clearConsole()" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:4px;cursor:pointer;">Clear</button>
    </div>
    <div id="consoleContent"></div>
  </div>

</div>

<script>
let currentJob = null;
let pollTimer = null;

async function loadVideos() {
  const sel = document.getElementById('fileSelect');
  sel.innerHTML = '<option value="">— select —</option>';
  const r = await fetch('/api/publish/list-videos').catch(() => null);
  if (!r || !r.ok) return;
  const data = await r.json();
  for (const v of data.videos || []) {
    const opt = document.createElement('option');
    opt.value = v.path;
    opt.textContent = v.name;
    sel.appendChild(opt);
  }
  sel.onchange = onFileSelected;
  // Auto-select the most recent file (backend returns newest first)
  if (data.videos && data.videos.length > 0) {
    sel.value = data.videos[0].path;
    onFileSelected();
  }
}

function previewFile(path) {
  const wrap = document.getElementById('videoWrap');
  const vid = document.getElementById('videoPreview');
  const nameEl = document.getElementById('videoName');
  wrap.style.display = 'block';
  vid.src = '/api/publish/video-preview?file=' + encodeURIComponent(path);
  nameEl.textContent = path.split('/').pop();
}

function previewSource() {
  const sel = document.getElementById('fileSelect');
  if (!sel || !sel.value) return;
  const wrap = document.getElementById('videoWrap');
  const vid = document.getElementById('videoPreview');
  const nameEl = document.getElementById('videoName');
  wrap.style.display = 'block';
  vid.src = '/api/publish/video-preview?file=' + encodeURIComponent(sel.value);
  nameEl.textContent = sel.options[sel.selectedIndex].textContent;
}

function onFileSelected() {
  const sel = document.getElementById('fileSelect');
  const wrap = document.getElementById('videoWrap');
  const vid = document.getElementById('videoPreview');
  const nameEl = document.getElementById('videoName');
  if (!sel.value) {
    wrap.style.display = 'none';
    vid.pause();
    return;
  }
  wrap.style.display = 'block';
  vid.src = '/api/publish/video-preview?file=' + encodeURIComponent(sel.value);
  nameEl.textContent = sel.options[sel.selectedIndex].textContent;
  checkResumeAvailable(sel.value);
  // Pre-fill from meta if exists
  fetch('/api/publish/check-resume', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source: sel.value})
  }).then(r => r.json()).then(data => {
    // description prefix
    if (data.description_prefix) {
      document.getElementById('descPrefix').value = data.description_prefix;
    } else {
      document.getElementById('descPrefix').value = '';
    }

    // source urls
    const srcUrlsEl = document.getElementById('sourceUrls');
    if (data.source_urls && data.source_urls.length) {
      srcUrlsEl.value = data.source_urls.join('\n');
    } else {
      srcUrlsEl.value = '';
    }
  }).catch(() => {
    // no meta or error → clean fields
    document.getElementById('descPrefix').value = '';
    document.getElementById('sourceUrls').value = '';
  });
}

async function loadPrompts() {
  const [promptRes, cfgRes] = await Promise.all([
    fetch('/api/publish/list-prompts').catch(() => null),
    fetch('/api/publish/config').catch(() => null)
  ]);
  if (!promptRes || !promptRes.ok) return;
  const data = await promptRes.json();
  const names = data.prompts || [];
  const t = document.getElementById('promptTitle');
  const s = document.getElementById('promptSummary');
  t.innerHTML = '';
  s.innerHTML = '';
  for (const n of names) {
    const o1 = document.createElement('option'); o1.value = n; o1.textContent = n; t.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = n; o2.textContent = n; s.appendChild(o2);
  }
  let defTitle = 'youtube-title';
  let defDesc = 'youtube-summary';
  if (cfgRes && cfgRes.ok) {
    const cfg = await cfgRes.json();
    defTitle = cfg.default_title_prompt || defTitle;
    defDesc = cfg.default_description_prompt || defDesc;
    const link = document.getElementById('modalUsageLink');
    if (link && cfg.modal_usage_url) link.href = cfg.modal_usage_url;
  }
  if (names.includes(defTitle)) t.value = defTitle;
  if (names.includes(defDesc)) s.value = defDesc;

  // Auto-save chosen prompts as new defaults
  t.onchange = () => savePromptDefaults(t.value, s.value);
  s.onchange = () => savePromptDefaults(t.value, s.value);
}

async function savePromptDefaults(title, desc) {
  const body = { default_title_prompt: title, default_description_prompt: desc };
  // merge with current config to avoid overwriting other fields
  const cur = await fetch('/api/publish/config').then(r => r.json()).catch(() => ({}));
  Object.assign(body, cur);
  await fetch('/api/publish/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
}

async function startJob() {
  const src = document.getElementById('fileSelect').value;
  if (!src) { alert('Select a video'); return; }
  const body = {
    source: src,
    prompt_title: document.getElementById('promptTitle').value,
    prompt_summary: document.getElementById('promptSummary').value,
    do_remove_silence: document.getElementById('removeSilence').checked,
    do_burn_subtitles: document.getElementById('burnSubtitles').checked,
    simple_transcript: document.getElementById('simpleTranscript').checked,
    skip_upload: document.getElementById('skipUpload').checked,
    use_modal: document.getElementById('useModal').checked,
    language: document.getElementById('language').value,
    model: document.getElementById('model').value,
    privacy: document.getElementById('privacy').value,
    description_prefix: document.getElementById('descPrefix').value,
    source_urls: (document.getElementById('sourceUrls').value || '').split('\n')
  };
  // Immediate publish (only if pool not running)
  const poolState = await fetch('/api/publish/pool').then(r => r.json()).catch(() => ({}));
  if (poolState.running) {
    alert('Pool is running. Use "Add to pool" instead or stop the pool first.');
    return;
  }
  const r = await fetch('/api/publish/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) { alert('Failed to start'); return; }
  const data = await r.json();
  currentJob = data.job_id;
  document.getElementById('resumeArea').style.display = 'none';
  pollStatus();
}

async function pollStatus() {
  if (!currentJob) return;
  clearTimeout(pollTimer);
  const r = await fetch('/api/publish/status/' + currentJob).catch(() => null);
  if (!r || !r.ok) { pollTimer = setTimeout(pollStatus, 2000); return; }
  const j = await r.json();
  renderSteps(j);
  if (j.status === 'done' || j.status === 'error') {
    showResult(j);
    document.getElementById('resumeBtn').style.display = 'none';
    return;
  }
  pollTimer = setTimeout(pollStatus, 1500);
}

function renderSteps(job) {
  const container = document.getElementById('steps');
  container.innerHTML = '';
  for (const s of job.steps) {
    const el = document.createElement('div');
    el.className = 'step';
    let icon = '⏳';
    if (s.status === 'done') icon = '✅';
    else if (s.status === 'error') icon = '❌';
    else if (s.status === 'skipped') icon = '⏭️';
    else if (s.status === 'running') icon = '▶️';
    let html = `<div class="step-icon">${icon}</div><div class="step-name">${s.name}`;
    if (s.progress != null) html += ` <progress class="step-progress" value="${s.progress}" max="100"></progress>`;
    if (s.elapsed_seconds != null) html += ` <span class="step-time">${s.elapsed_seconds}s</span>`;
    html += `</div>`;
    if (s.output) {
      const collapsed = s.status === 'running' ? '' : 'collapsed';
      html += `<div class="step-out ${collapsed}">${s.output}</div><span class="step-toggle" onclick="this.previousElementSibling.classList.toggle('collapsed');this.textContent=this.textContent==='…'?'▴':'…'">…</span>`;
    }
    if (s.output_files && s.output_files.length) {
      html += '<div class="step-dl">' + s.output_files.map(f => {
        const dl = `<a href="/api/publish/download?file=${encodeURIComponent(f.path)}" download>⬇ ${f.name}</a>`;
        const preview = f.path.match(/\.(mp4|mkv|mov|webm)$/i)
          ? `<button class="btn-sec" style="padding:1px 5px;font-size:10px;" onclick="previewFile('${f.path}')">👁</button>`
          : '';
        return dl + preview;
      }).join(' ') + '</div>';
    }
    el.innerHTML = html;
    container.appendChild(el);
  }
}

function showResult(job) {
  const box = document.getElementById('result');
  box.style.display = 'block';
  document.getElementById('resultTitle').textContent = job.title || '(no title)';
  document.getElementById('resultDesc').textContent = job.description || '';
  const links = document.getElementById('resultLinks');
  links.innerHTML = '';
  if (job.video_url) links.innerHTML += `<a href="${job.video_url}" target="_blank">Watch on YouTube</a>`;
  if (job.studio_url) links.innerHTML += `<a href="${job.studio_url}" target="_blank">Studio edit</a>`;
  if (job.elapsed_seconds != null) {
    links.innerHTML += `<span style="margin-left:12px;color:var(--dim);">⏱ ${job.elapsed_seconds}s total</span>`;
  }
}

async function checkResumeAvailable(source) {
  const r = await fetch('/api/publish/check-resume', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source}) }).catch(() => null);
  if (!r || !r.ok) return;
  const data = await r.json();
  const btn = document.getElementById('resumeBtn');
  const area = document.getElementById('resumeArea');
  if (data.can_resume) {
    btn.style.display = 'inline-block';
    btn.onclick = () => showResumeOptions(source, data);
  } else {
    btn.style.display = 'none';
    area.style.display = 'none';
  }
}

function showResumeOptions(source, data) {
  const area = document.getElementById('resumeArea');
  const sel = document.getElementById('resumeStep');
  sel.innerHTML = '';
  const STEP_NAMES = ["Remove silence","Extract transcript","Burn subtitles","Generate title & description","Upload to YouTube"];
  for (const st of data.available_from_steps) {
    const o = document.createElement('option');
    o.value = st;
    o.textContent = `Step ${st}: ${STEP_NAMES[st-1] || ''}`;
    sel.appendChild(o);
  }
  area.style.display = 'block';
  area.dataset.source = source;
  const filesDiv = document.getElementById('resumeFiles');
  filesDiv.innerHTML = (data.step_files || []).flat().map(f => `<a href="/api/publish/download?file=${encodeURIComponent(f.path)}" download>${f.name}</a>`).join('');
}

async function doResume() {
  const area = document.getElementById('resumeArea');
  const source = area.dataset.source;
  const from = parseInt(document.getElementById('resumeStep').value, 10);
  const body = {
    source,
    prompt_title: document.getElementById('promptTitle').value,
    prompt_summary: document.getElementById('promptSummary').value,
    from_step: from,
    do_burn_subtitles: document.getElementById('burnSubtitles').checked,
    simple_transcript: document.getElementById('simpleTranscript').checked,
    skip_upload: document.getElementById('skipUpload').checked,
    use_modal: document.getElementById('useModal').checked,
    language: document.getElementById('language').value,
    model: document.getElementById('model').value,
    privacy: document.getElementById('privacy').value,
    description_prefix: document.getElementById('descPrefix').value,
    source_urls: (document.getElementById('sourceUrls').value || '').split('\n')
  };
  const r = await fetch('/api/publish/resume', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) { alert('Resume failed'); return; }
  const data = await r.json();
  currentJob = data.job_id;
  area.style.display = 'none';
  pollStatus();
}

function STEP_NAMES() {
  return ["Remove silence","Extract transcript","Burn subtitles","Generate title & description","Upload to YouTube"];
}

async function uploadNew() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'video/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch('/api/publish/upload-external', { method: 'POST', body: fd }).catch(() => null);
    if (!r || !r.ok) { alert('Upload failed'); return; }
    const data = await r.json();
    const sel = document.getElementById('fileSelect');
    const opt = document.createElement('option');
    opt.value = data.path;
    opt.textContent = data.name + ' (uploaded)';
    sel.appendChild(opt);
    sel.value = data.path;
    onFileSelected();
  };
  input.click();
}

async function showConfig() {
  const p = document.getElementById('configPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
  if (p.style.display === 'block') {
    const r = await fetch('/api/publish/config').catch(() => null);
    if (r && r.ok) {
      const c = await r.json();
      document.getElementById('cfgPath').value = c.video_source_path || '';
      document.getElementById('cfgExts').value = c.video_extensions || '';
      document.getElementById('cfgTitlePrompt').value = c.default_title_prompt || 'youtube-title';
      document.getElementById('cfgDescPrompt').value = c.default_description_prompt || 'youtube-summary';
      document.getElementById('cfgSignature').value = c.signature || '';
      document.getElementById('cfgPostScript').value = c.post_publish_script || '';
      document.getElementById('cfgModalUsageUrl').value = c.modal_usage_url || '';
    }
  }
}

async function saveConfig() {
  const body = {
    video_source_path: document.getElementById('cfgPath').value,
    video_extensions: document.getElementById('cfgExts').value,
    default_title_prompt: document.getElementById('cfgTitlePrompt').value || 'youtube-title',
    default_description_prompt: document.getElementById('cfgDescPrompt').value || 'youtube-summary',
    signature: document.getElementById('cfgSignature').value,
    post_publish_script: document.getElementById('cfgPostScript').value,
    modal_usage_url: document.getElementById('cfgModalUsageUrl').value
  };
  const r = await fetch('/api/publish/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.ok) alert('Saved'); else alert('Save failed');
}

async function toggleConfig() {
  const p = document.getElementById('configPanel');
  const willShow = p.style.display !== 'block';
  p.style.display = willShow ? 'block' : 'none';
  if (willShow) {
    const r = await fetch('/api/publish/config').catch(() => null);
    if (r && r.ok) {
      const c = await r.json();
      document.getElementById('cfgPath').value = c.video_source_path || '';
      document.getElementById('cfgExts').value = c.video_extensions || '';
      document.getElementById('cfgTitlePrompt').value = c.default_title_prompt || 'youtube-title';
      document.getElementById('cfgDescPrompt').value = c.default_description_prompt || 'youtube-summary';
      document.getElementById('cfgSignature').value = c.signature || '';
      document.getElementById('cfgPostScript').value = c.post_publish_script || '';
      document.getElementById('cfgModalUsageUrl').value = c.modal_usage_url || '';
      const link = document.getElementById('modalUsageLink');
      if (link && c.modal_usage_url) link.href = c.modal_usage_url;
    }
  }
}

function initDropZone() {
  const zone = document.getElementById('dropZone');
  if (!zone) return;
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', async e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    await uploadFile(file);
  });
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch('/api/publish/upload-external', { method: 'POST', body: fd }).catch(() => null);
  if (!r || !r.ok) { alert('Upload failed'); return; }
  const data = await r.json();
  const sel = document.getElementById('fileSelect');
  const opt = document.createElement('option');
  opt.value = data.path;
  opt.textContent = data.name + ' (uploaded)';
  sel.appendChild(opt);
  sel.value = data.path;
  onFileSelected();

  // Auto-add uploaded file to pool
  await fetch('/api/publish/pool/add', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ source: data.path })
  });
  refreshPool();
}

/* ── Pool UI ───────────────────────────────────────────── */
async function refreshPool() {
  const r = await fetch('/api/publish/pool').catch(() => null);
  if (!r || !r.ok) return;
  const data = await r.json();
  // Feed all subcommand outputs from pool items into global console
  data.items.forEach(item => {
    if (item.job && item.job.steps) {
      item.job.steps.forEach(s => {
        if (s.output && s.output.trim()) {
          appendToConsole(`${s.name}: ${s.output.trim()}`);
        }
      });
    }
  });
  const statusEl = document.getElementById('poolStatus');
  statusEl.textContent = data.running ? '● Running' : '○ Stopped';
  statusEl.style.color = data.running ? 'var(--ok)' : 'var(--dim)';

  const list = document.getElementById('poolList');

  list.innerHTML = '';
  data.items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'pool-row';
    const name = item.source.split('/').pop();
    const st = item.status;
    let html = `<span>${name} <small style="color:var(--dim)">(${st})</small></span>`;

    // Show steps if we have job progress (no outputs here — see global console)
    if (item.job && item.job.steps) {
      html += '<div style="font-size:11px;color:var(--dim);margin-top:2px;">';
      item.job.steps.forEach(s => {
        const icon = s.status === 'done' ? '✅' : (s.status === 'running' ? '⏳' : (s.status === 'error' ? '❌' : '○'));
        html += `${icon} ${s.name} `;
      });
      html += '</div>';
    }

    // Finished / error item: time + logs (use existing name line above)
    if (item.status === 'finished' || item.status === 'error') {
      if (item.video_url) {
        html += `<div><a href="${item.video_url}" target="_blank" style="color:var(--link);font-size:12px;">▶ Watch</a></div>`;
      }
      if (item.studio_url) {
        html += `<div><a href="${item.studio_url}" target="_blank" style="color:var(--link);font-size:12px;">✏️ Edit in Studio</a></div>`;
      }

      const timeVal = (item.elapsed_seconds != null) ? item.elapsed_seconds : (item.job && item.job.elapsed_seconds != null ? item.job.elapsed_seconds : null);
      if (timeVal != null) {
        html += `<div style="font-size:11px;color:var(--dim);">⏱ ${timeVal}s</div>`;
      }
    }

    html += `<span class="pool-actions"><button onclick="poolRemove('${item.source}')">✕</button></span>`;
    row.innerHTML = html;
    list.appendChild(row);
  });
}

async function poolRemove(source) {
  await fetch('/api/publish/pool/remove', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source })
  });
  refreshPool();
}

async function browserHide() {
  await fetch('/api/publish/browser/hide', { method: 'POST' });
}

async function browserShow() {
  await fetch('/api/publish/browser/show', { method: 'POST' });
}

async function browserStartSilent() {
  await fetch('/api/publish/browser/start-silent', { method: 'POST' });
}

async function poolAction(action) {
  await fetch(`/api/publish/pool/${action}`, { method: 'POST' });
  refreshPool();
}

async function addToPool() {
  const sel = document.getElementById('fileSelect');
  if (!sel || !sel.value) {
    alert('Select a video first');
    return;
  }
  await fetch('/api/publish/pool/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      source: sel.value,
      description_prefix: document.getElementById('descPrefix').value,
      source_urls: (document.getElementById('sourceUrls').value || '').split('\n'),
      skip_upload: document.getElementById('skipUpload').checked
    })
  });
  refreshPool();
}

let lastConsoleContent = '';
let consoleEl = null;

function appendToConsole(text) {
  if (!text || !text.trim()) return;
  if (!consoleEl) consoleEl = document.getElementById('consoleContent');
  const box = document.getElementById('globalConsole');
  box.style.display = 'block';
  consoleEl.textContent += (consoleEl.textContent ? '\n' : '') + text;
  // always auto-scroll to latest line
  box.scrollTop = box.scrollHeight;
  lastConsoleContent = consoleEl.textContent;
}

function clearConsole() {
  if (consoleEl) consoleEl.textContent = '';
  lastConsoleContent = '';
  document.getElementById('globalConsole').style.display = 'none';
}

// Hook into existing render to feed console
const origRender = renderSteps;
renderSteps = function(job) {
  origRender(job);
  if (job.steps) job.steps.forEach(s => { if (s.output) appendToConsole(s.name + ': ' + s.output); });
};

function initPool() {
  document.getElementById('poolStart').onclick = () => poolAction('start');
  document.getElementById('poolStop').onclick = () => poolAction('stop');
  document.getElementById('poolSkip').onclick = () => poolAction('skip');
  document.getElementById('poolRedo').onclick = () => poolAction('redo');
  document.getElementById('poolClear').onclick = () => poolAction('clear-finished');
  setInterval(refreshPool, 2000);
  refreshPool();
}

function init() {
  loadVideos();
  loadPrompts();
  initDropZone();
  initPool();
  document.getElementById('goBtn').disabled = false;
}
init();
