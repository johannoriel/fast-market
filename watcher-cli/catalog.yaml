variables:
  - {id: oat_10y, label: "France 10-year constant maturity rate (TEC10, daily, Banque de France)", provider: bdf, symbol: "FM.D.FR.EUR.FR2.BB.FRMOYTEC10.HSTA", unit: "percent", max_age: 5d, news_topics: [france_debt_ecb]}
  - {id: us_10y, label: "USA 10-year Treasury yield (DGS10, daily, FRED)", provider: fred, symbol: "DGS10", unit: "percent", max_age: 5d, news_topics: [us_treasury_fed]}
  - {id: uk_10y, label: "UK 10-year Gilt yield (GB10Y, daily, CNBC)", provider: cnbc, symbol: "GB10Y", unit: "percent", max_age: 5d, news_topics: [uk_gilts]}
  - {id: de_10y, label: "Germany 10-year Bund yield (MTS, daily, Yahoo)", provider: yahoo, symbol: "MDE10.AS", unit: "percent", max_age: 5d, news_topics: [german_bunds]}
  - {id: brent, label: "Brent crude oil spot", provider: fred, symbol: "DCOILBRENTEU", unit: "USD/bbl", max_age: 5d, news_topics: [oil_opec]}
  - {id: wti, label: "WTI crude oil spot", provider: fred, symbol: "DCOILWTICO", unit: "USD/bbl", max_age: 5d, news_topics: [oil_opec]}
  - {id: gold, label: "Gold spot", provider: stooq, symbol: "xauusd", unit: "USD/oz", max_age: 5d, news_topics: [gold_central_banks]}
  - {id: bitcoin, label: "Bitcoin (EUR)", provider: kraken, symbol: "bitcoin:eur", unit: "EUR", max_age: 1d, news_topics: [bitcoin_regulation]}
  - {id: spacex, label: "SpaceX (SPCX, Nasdaq, daily, Yahoo)", provider: yahoo, symbol: "SPCX", unit: "USD", max_age: 5d, news_topics: [spacex_spcx]}
  - {id: eurusd, label: "Euro/US Dollar spot (daily, Yahoo)", provider: yahoo, symbol: "EURUSD=X", unit: "USD/EUR", max_age: 5d, news_topics: [eur_usd_fx]}
news_topics:
