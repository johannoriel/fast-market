  - {id: uk_gilts, label: "UK Gilts & Bank of England", query: "UK gilt yield Bank of England", lang: en}
  - {id: german_bunds, label: "German Bunds & ECB", query: "German Bund yield ECB", lang: en}
  - {id: oil_opec, label: "Oil & OPEC", query: "oil price OPEC", lang: en}
  - {id: gold_central_banks, label: "Gold & central banks", query: "gold central banks", lang: en}
  - {id: bitcoin_regulation, label: "Bitcoin & regulation", query: "bitcoin regulation", lang: en}
  - {id: spacex_spcx, label: "SpaceX & SPCX", query: "SpaceX SPCX stock", lang: en}
  - {id: eur_usd_fx, label: "Euro dollar FX", query: "EUR USD exchange rate", lang: en}
