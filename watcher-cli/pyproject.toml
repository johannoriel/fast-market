[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "watcher-agent"
version = "0.1.0"
description = "Personal market and macro watchlist CLI."
requires-python = ">=3.11"
dependencies = ["click>=8.1", "httpx>=0.27", "pyyaml>=6.0", "pydantic>=2.0"]
[project.scripts]
watcher = "watcher_entry:main"
[tool.setuptools]
packages = ["watcher_entry", "cli", "core", "plugins", "plugins.base", "plugins.coingecko", "plugins.stooq", "plugins.dbnomics", "plugins.google_news", "commands", "commands.get", "commands.history", "commands.news", "commands.dashboard", "commands.setup", "commands.wizard"]
