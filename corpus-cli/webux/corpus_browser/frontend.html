<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corpus Browser</title>
  <style>
    :root {
      --bg:#1a1a2e; --surface:#16213e; --accent:#0f3460; --text:#eee;
      --text-dim:#9ca3af; --border:#334155; --error:#f87171; --success:#10b981;
      --warn:#f59e0b; --info:#38bdf8;
    }
    * { box-sizing:border-box; }
    body { margin:0; padding:16px; background:var(--bg); color:var(--text);
           font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
    .header { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
    .header h1 { font-size:1.2em; margin:0 16px 0 0; }
    input, select, button { padding:7px 10px; border:1px solid var(--border);
             background:var(--surface); color:var(--text); border-radius:6px; font-size:13px; }
    input[type="date"] { width:132px; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
    .banner { border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:13px;
              border:1px solid var(--border); }
    .banner.warn { background:#3b2f0a; border-color:var(--warn); color:var(--warn); }
    .banner.err { background:#3b1414; border-color:var(--error); color:var(--error); }
    .banner.ok { background:#0a3322; border-color:var(--success); color:var(--success); }
    .banner.info { background:#0c2b38; border-color:var(--info); color:var(--info); }
    .actionbar { display:none; gap:8px; flex-wrap:wrap; align-items:center;
             background:var(--surface); border:1px solid var(--border); border-radius:8px;
             padding:8px 12px; margin-bottom:10px; }
    .actionbar.active { display:flex; }
    .actionbar .cnt { color:var(--text-dim); font-size:13px; font-weight:600; }
    .actionbar a { color:var(--info); cursor:pointer; font-size:13px; text-decoration:none; }
    .actionbar a:hover { text-decoration:underline; }
    .divider { color:var(--text-dim); margin:0 4px; }
    .columns-panel { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
             background:var(--surface); border:1px solid var(--border); border-radius:8px;
             padding:8px 12px; margin-bottom:10px; font-size:13px; }
    .columns-panel .columns-title { color:var(--text-dim); font-weight:600; }
    .columns-panel label { display:inline-flex; gap:4px; align-items:center; cursor:pointer; }
    .columns-panel input { padding:0; width:auto; }
    td.transcript { max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             color:var(--text-dim); font-size:12px; }
    td.clickable-cell { cursor:pointer; }
    td.clickable-cell:hover { color:var(--info); text-decoration:underline; }
    .tablewrap { flex:1; overflow:auto; border:1px solid var(--border); border-radius:8px; background:var(--surface); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead { position:sticky; top:0; background:var(--accent); z-index:5; }
    th { padding:8px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--border); }
    th.sortable { cursor:pointer; user-select:none; }
    th.sortable:hover { text-decoration:underline; }
    th .arrow { color:var(--info); font-size:11px; margin-left:4px; }
    td { padding:6px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    tr:hover td { background:rgba(15,52,96,.35); }
    tr.selected td { background:rgba(16,185,129,.08); }
    tr.pool-row td { opacity:.62; }
    tr.pool-row:hover td { opacity:1; }
    .pool-status { color:var(--warn); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
    td.cell { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    td.mono { font-family:ui-monospace,monospace; font-size:12px; color:var(--text-dim); }
    .title-link { color:var(--info); cursor:pointer; text-decoration:none; }
    .title-link:hover { text-decoration:underline; }
    .pag { display:flex; justify-content:center; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .pag button { min-width:32px; }
    .spacer { flex:1; }
    .loading { text-align:center; padding:24px; color:var(--text-dim); }
    .preview { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.8); display:none; z-index:1000; }
    .preview-content { background:var(--surface); margin:5% auto; width:80%; max-height:80%; overflow-y:auto; padding:20px; border-radius:8px; }
    .preview-bar { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:8px; }
    .preview-bar .close-btn { float:none; }
    pre { white-space:pre-wrap; color:var(--text); }
    td.thumb { padding:3px 6px; }
    .thumb-img { display:block; width:96px; height:54px; object-fit:cover; border-radius:4px;
             border:1px solid var(--border); cursor:zoom-in; }
    .thumb-img:hover { border-color:var(--info); transform:scale(1.04); }
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; z-index:1100;
             align-items:center; justify-content:center; cursor:zoom-out; }
    .lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 0 40px rgba(0,0,0,.6); }
    .lightbox-close { position:fixed; top:16px; right:24px; cursor:pointer; font-size:2.2em; color:var(--text);
             line-height:1; user-select:none; }
    .tooltip { position:fixed; z-index:1200; max-width:420px; max-height:300px; overflow:auto;
             background:var(--accent); border:1px solid var(--info); border-radius:6px;
             padding:8px 10px; font-size:12px; line-height:1.45; white-space:pre-wrap;
             color:var(--text); box-shadow:0 4px 20px rgba(0,0,0,.5); pointer-events:none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Corpus Browser</h1>
    <input id="q" placeholder="Search transcripts…" />
    <select id="mode">
      <option value="keyword">keyword</option>
      <option value="semantic">semantic</option>
    </select>
    <button id="searchBtn">Search</button>
    <button id="browseBtn">Browse All</button>
    <span class="spacer"></span>
    <span id="scanButtons"></span>
    <button id="enrichBtn" title="Bulk-fill metadata for all non-synced items via yt-dlp (no API quota)">Enrich all</button>
  </div>

  <div class="banner" id="banner" style="display:none;"></div>

  <div class="filters">
    <select id="sourceFilter"><option value="">All sources</option></select>
    <input type="date" id="since" title="Since date"/>
    <input type="date" id="until" title="Until date"/>
    <input type="number" id="minDuration" placeholder="Min s" min="0" style="width:84px"/>
    <input type="number" id="maxDuration" placeholder="Max s" min="0" style="width:84px"/>
    <label title="Hide videos up to 3 minutes (Shorts)">
      <input type="checkbox" id="excludeShorts"/> exclude shorts
    </label>
    <select id="missingFieldSelect"><option value="">Missing field…</option></select>
    <label title="Only show rows where the selected field has no value">
      <input type="checkbox" id="missingOnly"/> only missing
    </label>
    <select id="viewFilter" title="'not-synced' = pending + failed + excluded, i.e. everything scanned but not yet indexed. 'synced' shows only indexed documents. A 'pending' item was scanned but never fetched; 'failed' was tried but errored; 'excluded' was skipped (e.g. Shorts).">
      <option value="all">View: all</option>
      <option value="synced">Synced (indexed only)</option>
      <option value="not-synced">Not synced (pending + failed + excluded)</option>
      <option value="pending">Pending (scanned, never fetched)</option>
      <option value="failed">Failed (errored on fetch)</option>
      <option value="excluded">Excluded (skipped, e.g. Shorts)</option>
    </select>
    <select id="orderBy">
      <option value="date">Sort: date</option>
      <option value="published">Published</option>
      <option value="size">Size</option>
      <option value="duration">Duration</option>
      <option value="title">Title</option>
    </select>
    <label><input type="checkbox" id="orderDesc" checked/> desc</label>
    <button id="applyBtn">Apply</button>
    <button id="columnsBtn" title="Choose which columns to display">Columns</button>
  </div>
  <div class="columns-panel" id="columnsPanel" style="display:none;">
    <span class="columns-title">Show columns:</span>
    <span id="columnToggles"></span>
  </div>

  <div class="actionbar" id="actionbar">
    <span class="cnt" id="selCount"></span>
    <button id="actionEnrichBtn" title="Enrich the selected videos (pool + synced) via yt-dlp">Enrich</button>
    <button id="syncPoolBtn" title="Index the selected not-synced (pool) videos into the corpus">Sync</button>
    <button id="resyncBtn" title="Re-fetch the transcript of the selected synced (indexed) documents and rebuild their chunks">Resync</button>
    <span class="divider">|</span>
    <select id="syncFieldSelect" title="Field to fill on the selection"></select>
    <button id="syncBtn" title="Run the selected derived-field operation on the selection">Fill field</button>
    <span class="divider">|</span>
    <input id="tagInput" placeholder="Add a tag…" style="width:130px;"/>
    <button id="tagBtn" title="Run the tag operation on the selection">Add tag</button>
    <span class="divider">|</span>
    <a id="selectAllLink" title="Apply the sync to every document matching the current filter">Select all N filtered</a>
    <a id="clearSel">clear</a>
  </div>

  <div class="tablewrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pag" id="pag"></div>

  <div class="preview" id="preview">
    <div class="preview-content">
      <div class="preview-bar">
        <button id="pCopy" title="Copy the shown text to the clipboard">Copy</button>
        <span class="close-btn" onclick="closePreview()">×</span>
      </div>
      <h2 id="pTitle"></h2>
      <div id="pMeta"></div>
      <pre id="pBody"></pre>
    </div>
  </div>

  <div class="lightbox" id="lightbox" style="display:none;">
    <span class="lightbox-close" onclick="closeLightbox()">×</span>
    <img id="lightboxImg" alt="Thumbnail preview"/>
  </div>

  <div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
'use strict';
const API = '/api/corpus_browser';
const PAGE_SIZE = 20;
const QUOTA_KEY = 'corpus_browser_quota_until';
const PREFS_KEY = 'corpus_browser_prefs';

const state = {
  sources: [], fields: [], ops: [], columns: [],
  items: [], results: [], mode: 'browse', total: 0, offset: 0,
  missingField: '', missingOnly: false,
  order: 'published', orderDesc: true,
  selected: new Set(), selectAllFiltered: false,
  currentPage: 0,
  jobs: new Map(),
  colPrefs: {fixedOff: [], fieldsOff: []},
};

const $ = id => document.getElementById(id);

function esc(v) {
  return String(v).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function cellText(v) {
  if (v === null || v === undefined) return '';
  return Array.isArray(v) ? v.join(', ') : String(v);
}

// ── user prefs: source + exclude-shorts survive reloads via localStorage ─────
function savePrefs() {
  localStorage.setItem(PREFS_KEY, JSON.stringify({
    source: $('sourceFilter').value,
    excludeShorts: $('excludeShorts').checked,
  }));
}
function restorePrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
    if (p.source && p.source !== $('sourceFilter').value) $('sourceFilter').value = p.source;
    $('excludeShorts').checked = !!p.excludeShorts;
  } catch (e) { /* corrupt prefs — ignore */ }
}

// ── column visibility: persisted server-side in the corpus tool config ───────
async function loadColumnPrefs() {
  try {
    const r = await fetch(API + '/columns/prefs');
    if (r.ok) {
      const p = await r.json();
      state.colPrefs = {fixedOff: p.fixedOff || [], fieldsOff: p.fieldsOff || []};
    }
  } catch (e) { /* keep defaults if server unreachable */ }
}
function saveColumnPrefs() {
  fetch(API + '/columns/prefs', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(state.colPrefs),
  }).catch(() => {});
}

function showBanner(msg, type) {
  const b = $('banner');
  b.className = 'banner ' + (type || 'info');
  b.innerHTML = '<a class="close-btn" onclick="hideBanner()">×</a>' + esc(msg);
  b.style.display = 'block';
  delete b.dataset.quota;
}
function hideBanner() { $('banner').style.display = 'none'; }

// ── quota state: set server-side, re-enabled client-side at reset ───────────
function quotaDeadline() {
  const raw = localStorage.getItem(QUOTA_KEY);
  if (!raw) return 0;
  const t = Date.parse(raw);
  return Number.isFinite(t) && t > Date.now() ? t : 0;
}
function setQuotaBlock(iso, note) {
  if (!iso) return;
  localStorage.setItem(QUOTA_KEY, iso);
  applyQuotaUI();
  showBanner('YouTube API quota exceeded' + (note ? ' — ' + note : '') +
    '. Retry possible after ' + new Date(iso).toLocaleString() +
    ' — search, sorting and derived-field sync keep working.', 'err');
  $('banner').dataset.quota = '1';
}
function applyQuotaUI() {
  const until = quotaDeadline();
  document.querySelectorAll('#scanButtons button[data-source]').forEach(btn => {
    btn.disabled = until > 0;
    btn.textContent = until > 0
      ? 'Quota — retry after ' + new Date(until).toLocaleTimeString()
      : 'Scan ' + btn.dataset.source;
  });
  const b = $('banner');
  if (!until && b.dataset.quota) { delete b.dataset.quota; hideBanner(); }
}
setInterval(applyQuotaUI, 15000); // cheap client-side re-enable at reset

// ── sources / fields / operations ────────────────────────────────────────────
async function loadSources() {
  const data = await (await fetch(API + '/sources')).json();
  state.sources = data.sources || [];
  $('sourceFilter').innerHTML = '<option value="">All sources</option>' +
    state.sources.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join('');
  $('scanButtons').innerHTML = state.sources
    .map(s => '<button data-source="' + esc(s) + '" id="scanBtn_' + esc(s) + '">Scan ' + esc(s) + '</button>')
    .join('');
  document.querySelectorAll('#scanButtons button').forEach(btn => {
    btn.onclick = () => runScan(btn.dataset.source);
  });
  applyQuotaUI();
  if (!state.sources.length && !state.emptyHint) {
    state.emptyHint = true;
    showBanner('Empty corpus: scan a source above to populate the sync pool, then `corpus sync` to index.', 'info');
  }
}

async function loadFields() {
  const src = $('sourceFilter').value;
  const data = await (await fetch(API + '/fields?source=' + encodeURIComponent(src))).json();
  state.fields = data.fields || [];
  state.missingField = '';
  $('missingFieldSelect').innerHTML = '<option value="">Missing field…</option>' +
    state.fields.map(f => '<option value="' + esc(f.name) + '">' + esc(f.name) + '</option>').join('');
  $('missingOnly').checked = false;
}

async function loadColumns() {
  const src = $('sourceFilter').value;
  const data = await (await fetch(API + '/columns?source=' + encodeURIComponent(src))).json();
  state.columns = data.columns || [];
  rebuildTableHeaders();
  if ($('columnsPanel').style.display === 'flex') renderColumnPanel();
}

async function loadOps() {
  const data = await (await fetch(API + '/operations')).json();
  state.ops = data.operations || [];
  $('syncFieldSelect').innerHTML = state.ops
    .map(o => '<option value="' + esc(o.field) + '">' + esc(o.field) +
      (o.applies_to !== 'all' ? ' (' + esc(o.applies_to) + ')' : '') + '</option>')
    .join('') || '<option value="">no fields</option>';
}

// ── dynamic columns ──────────────────────────────────────────────────────────
function currentSource() { return $('sourceFilter').value; }

function dynamicFields() {
  return state.columns || [];
}

// Fixed, toggleable table columns. `order` enables sorting (null = no sort).
function thumbBase(d) {
  if (d.source_plugin !== 'youtube') return null;
  const id = d.source_id || '';
  return id ? 'https://i.ytimg.com/vi/' + encodeURIComponent(id) + '/' : null;
}
function thumbImg(d) {
  const base = thumbBase(d);
  if (!base) return '';
  return '<img class="thumb-img" loading="lazy" src="' + base + 'default.jpg"' +
    ' title="Click to enlarge" data-big="' + base + 'maxresdefault.jpg"/>';
}

function fixedColumnDefs() {
  const meta = d => d.metadata || {};
  return [
    {key: 'thumb', label: 'Thumb', order: null, render: d => thumbImg(d)},
    {key: 'published', label: 'Published', order: 'published',
     render: d => cellText(meta(d).published_at || d.updated_at).slice(0, 10)},
    {key: 'size', label: 'Size', order: 'size',
     render: d => d.raw_text ? String(d.raw_text).length : ''},
    {key: 'duration', label: 'Duration', order: 'duration',
     render: d => (d.duration_seconds ?? '') + 's'},
    {key: 'title', label: 'Title', order: 'title',
     render: d => {
       const isPool = d.pool_status != null;
       const desc = (d.metadata && d.metadata.description) || '';
       return '<a class="title-link' + (isPool ? ' pool-link' : '') + '" data-handle="' + esc(d.handle) + '"' +
         (desc ? ' data-desc="' + esc(desc) + '"' : '') + '>' +
         esc(d.title || 'Untitled') + (isPool ? ' ⏳' : '') + '</a>';
     }},
    {key: 'transcript', label: 'Transcript', order: null,
     render: d => d.raw_text ? String(d.raw_text).slice(0, 80) : ''},
    {key: 'description', label: 'Description', order: null,
     render: d => {
       const t = (d.metadata && d.metadata.description) || '';
       return t ? t.slice(0, 80) : '';
     }},
    {key: 'handle', label: 'Handle', order: null,
     render: d => esc(d.handle)},
    {key: 'status', label: 'Status', order: null,
     render: d => d.pool_status ? '<span class="pool-status">' + esc(d.pool_status) + '</span>' : ''},
    {key: 'scan', label: 'Scan', order: null,
     render: d => d.pool_status ? esc(cellText(d.scan_at).slice(0, 10)) : ''},
  ];
}

// Default: all columns on. Prefs remember only the ones the user turned OFF,
// so new fixed columns and newly-detected dynamic fields appear automatically.
function columnEnabled(key) {
  return !state.colPrefs.fixedOff.includes(key);
}
function fieldColumnEnabled(name) {
  return !state.colPrefs.fieldsOff.includes(name);
}
function setColumnEnabled(key, on) {
  const off = state.colPrefs.fixedOff;
  state.colPrefs.fixedOff = on ? off.filter(k => k !== key) : [...new Set([...off, key])];
}
function setFieldColumnEnabled(name, on) {
  const off = state.colPrefs.fieldsOff;
  state.colPrefs.fieldsOff = on ? off.filter(k => k !== name) : [...new Set([...off, name])];
}

function headerTh(orderVal, label) {
  const active = state.order === orderVal;
  return '<th class="sortable" data-order="' + esc(orderVal) + '">' + esc(label) +
    '<span class="arrow">' + (active ? (state.orderDesc ? '▼' : '▲') : '') + '</span></th>';
}
function thPlain(label) {
  return '<th>' + esc(label) + '</th>';
}

function rebuildTableHeaders() {
  const cols = fixedColumnDefs();
  const visible = cols.filter(c => columnEnabled(c.key));
  let html = ''
    + '<th style="width:30px" title="Select all on this page"><input type="checkbox" id="selAllPage" aria-label="Select all on page"/></th>'
    + '<th>#</th>';
  html += visible.map(c => c.order ? headerTh(c.order, c.label) : thPlain(c.label)).join('');
  html += dynamicFields()
    .filter(f => fieldColumnEnabled(f.name))
    .map(f => headerTh('field:' + f.name, f.name)).join('');
  $('thead').innerHTML = html;
  $('selAllPage').onchange = e => toggleSelectPage(e.target.checked);
  document.querySelectorAll('#thead th.sortable').forEach(h => {
    h.onclick = () => {
      const ob = h.dataset.order;
      if (state.order === ob) state.orderDesc = !state.orderDesc;
      else { state.order = ob; state.orderDesc = true; }
      $('orderBy').value = state.order;
      $('orderDesc').checked = state.orderDesc;
      browse(0);
    };
  });
}

// ── column picker ─────────────────────────────────────────────────────────────
function renderColumnPanel() {
  const fixed = fixedColumnDefs();
  let html = fixed.map(c =>
    '<label><input type="checkbox" data-col="' + esc(c.key) + '"' +
    (columnEnabled(c.key) ? ' checked' : '') + '/> ' + esc(c.label) + '</label>'
  ).join('');
  html += dynamicFields().map(f =>
    '<label><input type="checkbox" data-field="' + esc(f.name) + '"' +
    (fieldColumnEnabled(f.name) ? ' checked' : '') + '/> ' + esc(f.name) + '</label>'
  ).join('');
  $('columnToggles').innerHTML = html;
  $('columnToggles').querySelectorAll('input').forEach(cb => {
    cb.onchange = () => {
      if (cb.dataset.col) setColumnEnabled(cb.dataset.col, cb.checked);
      else if (cb.dataset.field) setFieldColumnEnabled(cb.dataset.field, cb.checked);
      saveColumnPrefs();
      rebuildTableHeaders();
      renderCurrentRows();
    };
  });
}

function toggleColumnsPanel() {
  const p = $('columnsPanel');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  if (p.style.display === 'flex') renderColumnPanel();
}

// ── rows ─────────────────────────────────────────────────────────────────────
function visibleCellDefs() {
  return fixedColumnDefs().filter(c => columnEnabled(c.key));
}

function renderRows(docs) {
  const tbody = $('tbody');
  tbody.innerHTML = '';
  if (!docs.length) {
    tbody.innerHTML = '<tr><td colspan="99" class="loading">No documents.</td></tr>';
    return;
  }
  const cells = visibleCellDefs();
  const fields = dynamicFields().filter(f => fieldColumnEnabled(f.name));
  docs.forEach((doc, ix) => {
    const tr = document.createElement('tr');
    const meta = doc.metadata || {};
    const isPool = doc.pool_status != null;
    if (isPool) tr.className = 'pool-row';
    if (state.selected.has(doc.handle)) tr.className = 'selected';
    let html = '<td><input type="checkbox" data-handle="' + esc(doc.handle) + '"' +
      (state.selected.has(doc.handle) ? ' checked' : '') +
      (isPool ? ' title="Pool item — not indexed yet. Select it, then Sync to index."' : '') + '/></td>';
    html += '<td class="mono">' + (state.offset + ix + 1) + '</td>';
    cells.forEach(c => {
      if (c.key === 'thumb') html += '<td class="thumb">' + c.render(doc) + '</td>';
      else if (c.key === 'transcript' || c.key === 'description') {
        const kind = c.key;
        const full = kind === 'description'
          ? ((doc.metadata && doc.metadata.description) || '')
          : (doc.raw_text || '');
        html += '<td class="transcript clickable-cell" data-handle="' + esc(doc.handle) +
          '" data-kind="' + kind + '" title="' + esc(full) + '">' + esc(c.render(doc)) + '</td>';
      }
      else if (c.key === 'handle') html += '<td class="mono">' + c.render(doc) + '</td>';
      else html += '<td>' + c.render(doc) + '</td>';
    });
    fields.forEach(f => { html += '<td class="cell">' + esc(cellText(meta[f.name])) + '</td>'; });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.onchange = e => {
      const h = e.target.dataset.handle;
      if (e.target.checked) state.selected.add(h); else state.selected.delete(h);
      e.target.closest('tr').classList.toggle('selected', e.target.checked);
      updateActionBar();
    };
  });
  tbody.querySelectorAll('a.title-link').forEach(a => {
    a.onclick = () => {
      const row = docs.find(d => d.handle === a.dataset.handle);
      const url = row && (row.url || (row.metadata && row.metadata.url));
      if (url) {
        window.open(url, '_blank');
      } else {
        showPreview(a.dataset.handle);
      }
    };
  });
  tbody.querySelectorAll('td[data-kind]').forEach(td => {
    td.onclick = () => {
      const h = td.dataset.handle;
      const row = docs.find(d => d.handle === h);
      openTextPopup(h, td.dataset.kind, row);
    };
  });
  tbody.querySelectorAll('a.title-link[data-desc]').forEach(a => {
    a.addEventListener('mouseenter', showDescTooltip);
    a.addEventListener('mousemove', moveDescTooltip);
    a.addEventListener('mouseleave', hideDescTooltip);
  });
  tbody.querySelectorAll('img.thumb-img').forEach(im => {
    im.onclick = () => openLightbox(im.dataset.big);
  });
  const all = $('selAllPage');
  if (all) all.checked = docs.length > 0 && docs.every(d => state.selected.has(d.handle));
}

function updateActionBar() {
  $('actionbar').classList.toggle('active', state.selected.size > 0 || state.selectAllFiltered);
  $('selCount').textContent = state.selectAllFiltered
    ? 'All ' + state.total + ' filtered documents selected'
    : (state.selected.size + ' selected');
  $('selectAllLink').textContent = state.selectAllFiltered
    ? 'Selection = current filter (' + state.total + ' docs) — click to unselect'
    : 'Select all ' + state.total + ' filtered documents';
}

// ── browse & search ──────────────────────────────────────────────────────────
function currentParams() {
  const p = new URLSearchParams();
  const src = currentSource();
  if (src) p.set('source', src);
  const since = $('since').value; if (since) p.set('since', since);
  const until = $('until').value; if (until) p.set('until', until);
  const min = $('minDuration').value; if (min) p.set('min_duration', min);
  const max = $('maxDuration').value; if (max) p.set('max_duration', max);
  const view = $('viewFilter').value; if (view && view !== 'all') p.set('state', view);
  if ($('excludeShorts').checked) p.set('video_type', 'long');
  if (state.missingOnly && state.missingField) p.set('missing_field', state.missingField);
  return p;
}

function renderCurrentRows() {
  if (state.mode === 'search') renderSearchPage();
  else renderRows(state.items);
}

async function browse(offset = 0) {
  state.mode = 'browse';
  const p = currentParams();
  p.set('limit', PAGE_SIZE); p.set('offset', offset);
  p.set('order_by', state.order); p.set('order_desc', state.orderDesc);
  $('tbody').innerHTML = '<tr><td colspan="99" class="loading">Loading…</td></tr>';
  const r = await fetch(API + '/browse?' + p);
  const data = await r.json().catch(() => ({}));
  if (!r.ok || !data.items) {
    showBanner('Browse failed: ' + (data.detail || r.status) + ' — see server logs.', 'err');
    $('tbody').innerHTML = '';
    return;
  }
  state.items = data.items;
  state.total = data.total || 0;
  state.offset = offset;
  renderRows(state.items);
  renderPagination();
  updateActionBar();
  const hidden = data.shorts_hidden || 0;
  if (state.total === 0 && hidden > 0 && $('excludeShorts').checked) {
    showBanner(hidden + ' not-synced item(s) are Shorts and hidden by "exclude shorts". ' +
      'Uncheck the box to see them in this view.', 'warn');
  }
}

async function search() {
  const q = $('q').value.trim();
  if (!q) return browse(0);
  state.mode = 'search';
  state.currentPage = 0;
  const p = currentParams();
  p.set('q', q); p.set('mode', $('mode').value); p.set('limit', 500);
  $('tbody').innerHTML = '<tr><td colspan="99" class="loading">Searching…</td></tr>';
  const r = await fetch(API + '/search?' + p);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Search failed: ' + (data.detail || r.status), 'err'); return; }
  state.results = data.results || [];
  state.total = state.results.length;
  renderSearchPage();
}

function renderSearchPage() {
  const from = state.currentPage * PAGE_SIZE;
  const rows = state.results.slice(from, from + PAGE_SIZE).map(r => ({
    handle: r.handle, title: r.title, updated_at: '', duration_seconds: r.duration,
    raw_text: r.excerpt || '', metadata: {},
  }));
  renderRows(rows);
  renderPagination();
}

function renderPagination() {
  const total = state.total;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (total <= PAGE_SIZE) { $('pag').innerHTML = ''; return; }
  const current = state.mode === 'search' ? state.currentPage : Math.floor(state.offset / PAGE_SIZE);
  let html = '';
  const from = Math.max(0, current - 4);
  const to = Math.min(pages, from + 9);
  for (let i = from; i < to; i++) {
    html += '<button data-p="' + i + '"' + (i === current ? ' disabled' : '') + '>' + (i + 1) + '</button>';
  }
  $('pag').innerHTML = html;
  document.querySelectorAll('#pag button').forEach(b => {
    b.onclick = () => {
      const p = parseInt(b.dataset.p, 10);
      if (state.mode === 'search') { state.currentPage = p; renderSearchPage(); }
      else browse(p * PAGE_SIZE);
    };
  });
}

function showPreview(handle) {
  const pool = state.items.find(d => d.handle === handle && d.pool_status != null);
  if (pool) {
    $('pTitle').textContent = pool.title || 'Untitled';
    const m = pool.metadata || {};
    let metaHtml = 'Source: ' + esc(pool.source_plugin) +
      ' | Published: ' + esc(cellText(m.published_at).slice(0, 10)) +
      ' | Duration: ' + esc(cellText(pool.duration_seconds)) + 's' +
      '<br/><span class="pool-status">' + esc(pool.pool_status) + '</span> — scanned ' +
      esc((pool.scan_at || '').slice(0, 10)) + ', not synced into the corpus yet. ' +
      'Run `corpus sync` (or a field sync on the selection) to index it.';
    if (pool.url) metaHtml += '<br/>Original: <a href="' + esc(pool.url) + '" target="_blank">' + esc(pool.url) + '</a>';
    $('pMeta').innerHTML = metaHtml;
    $('pBody').textContent = m.description
      ? ('No transcript yet (not synced).\n\nDescription:\n' + m.description)
      : 'No transcript yet (not synced).';
    $('preview').style.display = 'block';
    return;
  }
  fetch(API + '/document/' + encodeURIComponent(handle)).then(r => r.json()).then(doc => {
    $('pTitle').textContent = doc.title || 'Untitled';
    let meta = 'Source: ' + esc(doc.source_plugin) +
      ' | Published: ' + esc(cellText((doc.metadata && doc.metadata.published_at) || doc.updated_at).slice(0, 10)) +
      ' | Duration: ' + esc(cellText(doc.duration_seconds)) + 's';
    if (doc.url) meta += '<br/>Original: <a href="' + esc(doc.url) + '" target="_blank">' + esc(doc.url) + '</a>';
    $('pMeta').innerHTML = meta;
    $('pBody').textContent = doc.raw_text || '';
    $('preview').style.display = 'block';
  });
}
function closePreview() { $('preview').style.display = 'none'; }

// ── text popup: click a transcript / description cell to read it fully ───────
async function openTextPopup(handle, kind, row) {
  const isPool = row && row.pool_status != null;
  let title = (row && row.title) || 'Untitled';
  let body = '';
  if (kind === 'transcript') {
    if (row && row.raw_text) body = row.raw_text;
    else if (isPool) body = 'No transcript yet (not synced).';
  } else if (row && row.metadata && row.metadata.description) {
    body = row.metadata.description;
  }
  if (!isPool) {
    // Always fetch the full document so search-result rows (which only carry an
    // excerpt) still show the complete transcript/description.
    try {
      const r = await fetch(API + '/document/' + encodeURIComponent(handle));
      if (r.ok) {
        const doc = await r.json();
        title = doc.title || title;
        body = kind === 'transcript'
          ? (doc.raw_text || '')
          : ((doc.metadata && doc.metadata.description) || '');
      }
    } catch (e) { /* keep row data as fallback */ }
  }
  $('pTitle').textContent = title;
  $('pMeta').textContent = kind === 'description' ? 'Description' : 'Transcript';
  $('pBody').textContent = body || '(empty)';
  $('preview').style.display = 'block';
}

// ── copy to clipboard (clipboard API with execCommand fallback) ──────────────
function copyText(text) {
  const done = () => showBanner('Copied to clipboard.', 'ok');
  const fail = () => showBanner('Copy failed — select the text manually.', 'err');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done, fail));
  } else fallbackCopy(text, done, fail);
}
function fallbackCopy(text, done, fail) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) done(); else fail();
}
$('pCopy').onclick = () => copyText($('pBody').textContent);

// ── lightbox: click a thumbnail to enlarge ───────────────────────────────────
function openLightbox(src) {
  const im = $('lightboxImg');
  im.onerror = () => { im.onerror = null; im.src = src.replace('maxresdefault', 'hqdefault'); };
  im.src = src;
  $('lightbox').style.display = 'flex';
}
function closeLightbox() { $('lightbox').style.display = 'none'; }
$('lightbox').onclick = e => { if (e.target !== $('lightboxImg')) closeLightbox(); };

// ── tooltip: full description on hover over a title ──────────────────────────
function showDescTooltip(e) {
  const tip = $('tooltip');
  tip.textContent = e.target.dataset.desc;
  tip.style.display = 'block';

}
function moveDescTooltip(e) {
  const tip = $('tooltip');
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 440) + 'px';
  tip.style.top = Math.min(e.clientY + 14, window.innerHeight - 320) + 'px';
}

document.addEventListener('keydown', e => {

});

// ── selection ────────────────────────────────────────────────────────────────
function visibleDocs() {
  return state.mode === 'search'
    ? state.results.slice(state.currentPage * PAGE_SIZE, (state.currentPage + 1) * PAGE_SIZE)
    : state.items;
}

function toggleSelectPage(checked) {
  visibleDocs().forEach(d => {
    if (checked) state.selected.add(d.handle); else state.selected.delete(d.handle);
  });
  renderRows(visibleDocs());
  updateActionBar();
}

function selectAllFiltered() {
  if (state.total < 1) { showBanner('Run Browse/Search first — need to know how many documents match.', 'warn'); return; }
  state.selectAllFiltered = !state.selectAllFiltered;

function clearSelection() {

// ── job: scan (with quota handling) ──────────────────────────────────────────
async function runScan(source) {
  if (quotaDeadline()) return;
  const r = await fetch(API + '/scan', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Scan start failed: ' + (data.detail || r.status), 'err'); return; }
  const btn = $('scanBtn_' + source);
  if (btn) btn.textContent = 'Scanning ' + source + '…';
  const timer = setInterval(() => pollScanJob(data.job_id, source), 2500);
  state.jobs.set(data.job_id, {kind: 'scan', timer, source});
  pollScanJob(data.job_id, source);
}

async function pollScanJob(jobId, source) {
  const r = await fetch(API + '/scan/status/' + jobId);
  if (!r.ok) { stopJob(jobId); return; }
  const j = await r.json();
  if (j.status === 'running') {
    const done = j.result ? (j.result.processed || 0) : 0;
    const btn = $('scanBtn_' + source);
    if (btn) btn.textContent = 'Scanning ' + source + '… (' + done + ')';
    return;
  }
  stopJob(jobId);
  const btn = $('scanBtn_' + source);
  if (btn) btn.textContent = 'Scan ' + source;
  applyQuotaUI();
  if (j.status === 'done' && j.result) {
    showBanner('Scan done: ' + j.result.added + ' new · ' + j.result.refreshed + ' refreshed' +
      (j.result.requeued ? ' · ' + j.result.requeued + ' re-queued' : ''), 'ok');
    return;
  }
  if (j.error && j.error.type === 'quota_exceeded') {
    setQuotaBlock(j.error.quota_reset_at,
      j.result && j.result.processed > 0
        ? j.result.processed + ' items processed before interruption — already-pooled items are kept'
        : '');
    if (j.result && j.result.processed > 0) {
      showBanner('Quota hit after ' + j.result.processed + ' items — work done so far is kept. Re-scan manually after reset.', 'err');
    }
    return;
  }
  showBanner('Scan failed: ' + (j.error ? (j.error.message || j.error.type) : 'unknown') +
    ' — check server logs and retry.', 'err');
}

function stopJob(jobId) {
  const j = state.jobs.get(jobId);
  if (j) { clearInterval(j.timer); state.jobs.delete(jobId); }
}

// ── jobs: yt-dlp enrichment ──────────────────────────────────────────────────
async function postEnrich(body) {
  const r = await fetch(API + '/enrich', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Enrich start failed: ' + (data.detail || r.status), 'err'); return; }
  setEnrichBusy(true);
  showBanner('Enriching via yt-dlp…', 'info');
  const timer = setInterval(() => pollEnrichJob(data.job_id), 2500);
  state.jobs.set(data.job_id, {kind: 'enrich', timer});
  pollEnrichJob(data.job_id);
}

// Selection-scoped: enrich the selected videos whether they're not-synced
// (pool) or already indexed (synced) — the backend splits the handles.
async function startEnrich() {
  const handles = selectedHandles();
  if (!handles.length) {
    showBanner('Select videos (synced or not-synced) first, or use "Enrich all" in the toolbar.', 'warn');
    return;
  }
  const source = sourceForSelection(handles);
  if (!source) {
    showBanner('Could not determine the source of the selection — set the source filter.', 'warn');
    return;
  }
  postEnrich({source, concurrency: 4, handles});
}

// Bulk: everything non-synced (or everything under the current filter, if "select all filtered").
async function startEnrichAll() {
  const body = {source: currentSource() || null, concurrency: 4};
  if (state.selectAllFiltered && state.total > 0) body.limit = Math.max(1, state.total);
  postEnrich(body);
}

function setEnrichBusy(busy) {
  $('enrichBtn').disabled = busy;
  $('enrichBtn').textContent = busy ? 'Enriching…' : 'Enrich all';
  $('actionEnrichBtn').disabled = busy;
  $('actionEnrichBtn').textContent = busy ? 'Enriching…' : 'Enrich';
}

async function pollEnrichJob(jobId) {
  const r = await fetch(API + '/enrich/status/' + jobId);
  if (!r.ok) { stopJob(jobId); setEnrichBusy(false); return; }
  const j = await r.json();
  if (j.status === 'running') return;
  stopJob(jobId);
  setEnrichBusy(false);
  if (j.status === 'done' && j.result) {
    const res = j.result;
    if (res.aborted) {
      showBanner('Enrich paused: ' + (res.abort_reason || 'YouTube bot challenge') +
        ' Provide cookies (--cookies / config) and retry later.', 'err');
      return;
    }
    showBanner('Enrich "' + res.source + '" done — processed ' + res.processed +
      ' · enriched ' + res.enriched + ' · unchanged ' + res.skipped +
      (res.failed ? ' · failed ' + res.failed : ''),
      res.failed ? 'err' : 'ok');
    loadColumns();
    clearSelection();
    if (state.mode === 'search') search(); else browse(state.offset);
    return;
  }
  showBanner('Enrich failed: ' + (j.error ? (j.error.message || j.error.type) : 'unknown') +
    ' — check server logs and retry.', 'err');
}

// ── jobs: index selected pool items (Sync) ───────────────────────────────────
function selectedPoolHandles() {
  const sel = [...state.selected].filter(h => h.startsWith('pool:'));
  if (state.selectAllFiltered) {
    for (const it of state.items) {
      if (it.pool_status && it.handle && it.handle.startsWith('pool:') && !sel.includes(it.handle)) {
        sel.push(it.handle);
      }
    }
  }
  return sel;
}

function inferSourceFromHandles(handles) {
  for (const h of handles) {
    const m = /^pool:([^:]+):/.exec(h);
    if (m) return m[1];
  }
  return '';
}

// All selected handles (pool + synced documents), expanding "select all filtered".
function selectedHandles() {
  const sel = [...state.selected];
  if (state.selectAllFiltered) {
    for (const it of state.items) {
      if (it.handle && !sel.includes(it.handle)) sel.push(it.handle);
    }
  }
  return sel;
}

// Only handles of already-indexed documents (non-pool).
function selectedSyncedHandles() {
  return selectedHandles().filter(h => !h.startsWith('pool:'));
}

// Best-effort source for a set of handles: the current source filter, else the
// source_plugin of any matching row (browse items or search results), else the
// pool-handle prefix.
function sourceForSelection(handles) {
  if (currentSource()) return currentSource();
  const wanted = new Set(handles);
  const all = state.items.concat(
    state.results.map(r => ({handle: r.handle, source_plugin: r.source_plugin}))
  );
  const hit = all.find(d => wanted.has(d.handle) && d.source_plugin);
  if (hit) return hit.source_plugin;
  return inferSourceFromHandles(handles);
}

async function startSyncPool() {
  const handles = selectedPoolHandles();
  if (!handles.length) {
    showBanner('Select not-synced (pool) videos first, then Sync to index them into the corpus.', 'warn');
    return;
  }
  const source = currentSource() || inferSourceFromHandles(handles);
  const poolHandles = handles.filter(h => h.startsWith('pool:' + source + ':'));
  if (!source || !poolHandles.length) {
    showBanner('No not-synced videos of a known source in the selection.', 'warn');
    return;
  }
  const r = await fetch(API + '/sync-pool', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source, handles: poolHandles}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Sync start failed: ' + (data.detail || r.status), 'err'); return; }
  showBanner('Syncing ' + poolHandles.length + ' selected video(s) into the corpus…', 'info');
  const timer = setInterval(() => pollSyncPoolJob(data.job_id), 2500);
  state.jobs.set(data.job_id, {kind: 'sync-pool', timer});
  pollSyncPoolJob(data.job_id);
}

async function pollSyncPoolJob(jobId) {
  const r = await fetch(API + '/sync-pool/status/' + jobId);
  if (!r.ok) { stopJob(jobId); return; }
  const j = await r.json();
  if (j.status === 'running') return;
  stopJob(jobId);
  if (j.status === 'done' && j.result) {
    const res = j.result;
    showBanner('Sync done — processed ' + res.processed + ' · indexed ' + res.indexed +
      ' · skipped ' + res.skipped +
      (res.failures.length ? ' · failed ' + res.failures.length : ''),
      res.failures.length ? 'err' : 'ok');
    clearSelection();
    loadColumns();
    if (state.mode === 'search') search(); else browse(state.offset);
    return;
  }
  showBanner('Sync failed: ' + (j.error ? (j.error.message || j.error.type) : 'unknown') +
    ' — check server logs and retry.', 'err');
}

// ── jobs: resync transcripts of synced documents ─────────────────────────────
async function startResync() {
  const handles = selectedSyncedHandles();
  if (!handles.length) {
    showBanner('Select synced (indexed) documents first to re-fetch their transcripts.', 'warn');
    return;
  }
  const source = sourceForSelection(handles);
  if (!source) {
    showBanner('Could not determine the source of the selection — set the source filter.', 'warn');
    return;
  }
  const r = await fetch(API + '/resync', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source, handles}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Resync start failed: ' + (data.detail || r.status), 'err'); return; }
  showBanner('Re-fetching transcripts of ' + handles.length + ' selected document(s)…', 'info');
  const timer = setInterval(() => pollResyncJob(data.job_id), 2500);
  state.jobs.set(data.job_id, {kind: 'resync', timer});
  pollResyncJob(data.job_id);
}

async function pollResyncJob(jobId) {
  const r = await fetch(API + '/resync/status/' + jobId);
  if (!r.ok) { stopJob(jobId); return; }
  const j = await r.json();
  if (j.status === 'running') return;
  stopJob(jobId);
  if (j.status === 'done' && j.result) {
    const res = j.result;
    showBanner('Resync done — processed ' + res.processed + ' · updated ' + res.indexed +
      ' · unchanged ' + res.skipped +
      (res.failures.length ? ' · failed ' + res.failures.length : ''),
      res.failures.length ? 'err' : 'ok');
    clearSelection();
    loadColumns();
    if (state.mode === 'search') search(); else browse(state.offset);
    return;
  }
  showBanner('Resync failed: ' + (j.error ? (j.error.message || j.error.type) : 'unknown') +
    ' — check server logs and retry.', 'err');
}

// ── jobs: field sync ─────────────────────────────────────────────────────────
function syncBodyFor(field) {
  const body = {field, source: currentSource() || null};
  if (state.selectAllFiltered) {
    body.since = $('since').value || null;
    body.until = $('until').value || null;
    body.min_duration = $('minDuration').value || null;
    body.max_duration = $('maxDuration').value || null;
    body.limit = Math.max(1, state.total);
  } else {
    body.handles = [...state.selected];
  }
  return body;
}

async function startSync(field) {
  if (!field) { showBanner('No derived field registered — create one via `corpus field create` and an operation.', 'warn'); return; }
  if (!state.selectAllFiltered && !state.selected.size) {
    showBanner('Select documents on the page, or use "Select all N filtered".', 'warn');
    return;
  }
  const r = await fetch(API + '/sync', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(syncBodyFor(field)),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { showBanner('Sync start failed: ' + (data.detail || r.status), 'err'); return; }
  showBanner('Syncing field "' + field + '"…', 'info');
  const timer = setInterval(() => pollSyncJob(data.job_id), 2500);
  state.jobs.set(data.job_id, {kind: 'sync', timer, field});
  pollSyncJob(data.job_id);
}

async function pollSyncJob(jobId) {
  const r = await fetch(API + '/sync/status/' + jobId);
  if (!r.ok) { stopJob(jobId); return; }
  const j = await r.json();
  if (j.status === 'running') return;
  stopJob(jobId);
  const jfield = (state.jobs.get(jobId) || {}).field || '';
  if (j.status === 'done' && j.result) {
    const res = j.result;
    let msg = 'Sync "' + jfield + '" done — processed ' + res.processed +
      ' · indexed ' + res.indexed + ' · skipped ' + (res.skipped || 0);
    if (res.failures && res.failures.length) {
      msg += ' · failed ' + res.failures.length + ' (use the missing-field filter to continue)';
    }
    showBanner(msg, res.failures && res.failures.length ? 'err' : 'ok');
    clearSelection();
    loadFields();
    loadColumns();
    if (state.mode === 'search') search(); else browse(state.offset);
    return;
  }
  if (j.error && j.error.type === 'quota_exceeded') {
    setQuotaBlock(j.error.quota_reset_at,
      j.result ? j.result.processed + ' documents processed before interruption' : '');
    return;
  }
  showBanner('Sync "' + jfield + '" failed: ' + (j.error ? (j.error.message || j.error.type) : 'unknown') +
    ' — check server logs and retry.', 'err');
}

// ── wiring ───────────────────────────────────────────────────────────────────
$('searchBtn').onclick = search;
$('browseBtn').onclick = () => browse(0);
$('applyBtn').onclick = () => { savePrefs(); loadFields(); loadColumns(); browse(0); };
$('sourceFilter').onchange = () => { savePrefs(); loadFields(); loadColumns(); browse(0); };
$('excludeShorts').onchange = () => { savePrefs(); browse(0); };
$('orderBy').onchange = () => { state.order = $('orderBy').value; browse(0); };
$('orderDesc').onchange = () => { state.orderDesc = $('orderDesc').checked; browse(0); };
  $('viewFilter').onchange = () => { browse(0); };
$('missingFieldSelect').onchange = () => { state.missingField = $('missingFieldSelect').value; browse(0); };
$('missingOnly').onchange = () => { state.missingOnly = $('missingOnly').checked; browse(0); };
$('syncBtn').onclick = () => startSync($('syncFieldSelect').value);
$('tagBtn').onclick = () => startSync('tags');
$('syncPoolBtn').onclick = startSyncPool;
$('resyncBtn').onclick = startResync;
$('actionEnrichBtn').onclick = startEnrich;
$('enrichBtn').onclick = startEnrichAll;
$('columnsBtn').onclick = toggleColumnsPanel;
$('selectAllLink').onclick = selectAllFiltered;
$('clearSel').onclick = clearSelection;

(async function init() {
  await loadSources();
  restorePrefs();
  await Promise.all([loadFields(), loadColumns(), loadOps(), loadColumnPrefs()]);
  browse(0);
})();
</script>
