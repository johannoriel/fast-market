# Seed of all prompts used by webux components.
# Import with: prompt setup webux import
# Auto-seeded on `webux serve`.
prompts:
- name: youtube-title
  description: Génère un titre accrocheur pour un YouTube Short à partir d'une transcription
  content: 'Suggère un titre accrocheur et engageant pour un YouTube Short basé sur
    la transcription suivante :


    {transcript}


    Le titre doit être concis, optimisé pour les clics, en français, avec des majuscules
    et des espaces (exemple : Astuce IA Incroyable à Essayer !). Réponds uniquement
    avec le titre, sans texte supplémentaire.'
  temperature: 0.7
  max_tokens: 2048
  model_provider: ''
  model_name: ''
- name: youtube-summary
  description: Génère une description optimisée pour un YouTube Short à partir d'une
